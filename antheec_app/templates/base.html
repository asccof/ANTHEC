{% load static %}
<!doctype html>
<html lang="{{ page.locale.language_code }}" dir="{% if page.locale.language_code == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | ANTHEEC</title>
  <meta name="description" content="{{ page.search_description }}">
  <link rel="stylesheet" href="{% static 'site.css' %}">
</head>
<body>
  <header><strong>ANTHEEC</strong><nav aria-label="Languages">
    {% for version in language_versions %}<a href="{{ version.url }}" lang="{{ version.locale.language_code }}" hreflang="{{ version.locale.language_code }}" {% if version.pk == page.pk %}aria-current="page"{% endif %}>{{ version.locale.get_display_name }}</a>{% endfor %}
  </nav></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
