{% extends 'governance/member_base.html' %}{% block content %}<section><h2>{{ labels.mfa_title }}</h2><p role="alert">{{ error }}</p><form method="post">{% csrf_token %}<label>{{ labels.password }} <input type="password" name="password" autocomplete="current-password" required></label><label>{{ labels.code }} <input name="code" autocomplete="one-time-code" required></label><label><input type="checkbox" name="recovery">{{ labels.recovery_use }}</label><button>{{ labels.verify }}</button></form>{% if not enrolled %}<a href="{% url 'security_enroll' %}?lang={{ language }}">{{ labels.mfa_setup }}</a>{% endif %}</section>{% endblock %}
