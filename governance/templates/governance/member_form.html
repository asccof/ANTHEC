{% extends 'governance/member_base.html' %}{% block content %}<section><h2>{{ title }}</h2><p>{{ labels.existing_record }}</p><p>{{ labels.terms }}</p><p>{{ labels.renew_notice }}</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}{{ form.as_p }}<button>{{ submit_label }}</button></form><script>
const capacity = document.getElementById('id_applicant_capacity');
const other = document.getElementById('id_capacity_other');
if (capacity && other) {
  const updateOther = () => {
    const selected = capacity.value === 'other';
    other.closest('p').hidden = !selected;
    other.disabled = !selected;
    other.required = selected;
  };
  capacity.addEventListener('change', updateOther);
  updateOther();
}
</script></section>{% endblock %}
