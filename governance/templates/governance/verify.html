<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>التحقق من وثيقة ANTHEEC</title><h1>التحقق من وثيقة</h1><p>أدخل مرجع الوثيقة والرمز المطبوع عليها، أو امسح رمز QR.</p><form id="verification" method="post">{% csrf_token %}<label>مرجع الوثيقة <input name="serial" maxlength="36"></label><label>رمز التحقق <input name="code" maxlength="16"></label><input type="hidden" name="token" id="token"><button>تحقق</button></form><script>const token=location.hash.slice(1);if(token){document.getElementById('token').value=token;history.replaceState(null,'',location.pathname);document.getElementById('verification').requestSubmit();}</script></html>
