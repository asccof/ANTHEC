<!doctype html><html lang="{{ language }}" dir="{{ direction }}"><head><meta charset="utf-8"><meta name="referrer" content="same-origin"><title>{{ labels.verify_title }}</title></head><body><nav><a href="?lang=ar">العربية</a> <a href="?lang=fr">Français</a> <a href="?lang=en">English</a></nav><h1>{{ labels.verify_title }}</h1><p>{{ labels.verify_hint }}</p><form id="verification" method="post">{% csrf_token %}<label>{{ labels.reference }} <input name="serial" maxlength="36"></label><label>{{ labels.code }} <input name="code" maxlength="16"></label><input type="hidden" name="token" id="token"><button>{{ labels.verify }}</button></form><script>const token=location.hash.slice(1);if(token){document.getElementById('token').value=token;history.replaceState(null,'',location.pathname+location.search);document.getElementById('verification').requestSubmit();}</script></body></html>
