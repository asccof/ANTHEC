{% if page.has_other_pages %}<nav class="tool-pagination" aria-label="{{ labels.title }}">{% if page.has_previous %}<a href="?lang={{ language }}&amp;page={{ page.previous_page_number }}&amp;state={{ state_filter }}">{{ labels.previous }}</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?lang={{ language }}&amp;page={{ page.next_page_number }}&amp;state={{ state_filter }}">{{ labels.next }}</a>{% endif %}</nav>{% endif %}
