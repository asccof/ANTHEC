{% extends 'governance/member_base.html' %}{% block content %}<h2>{{ photo_labels.title }}</h2><p>{{ photo_labels.notice }}</p><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button>{{ photo_labels.upload }}</button></form>{% for photo in portraits %}<section><p>{{ photo.serial }} — {{ photo.state_label }}</p><img src="{% url 'portrait_image' photo.serial %}" width="160" height="200" alt="{{ photo_labels.photo }}"></section>{% empty %}<p>{{ photo_labels.empty }}</p>{% endfor %}{% endblock %}
