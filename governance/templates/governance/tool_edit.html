{% extends 'governance/tool_admin_base.html' %}{% block tools_admin %}<section><h2>{% if tool %}{{ labels.edit }}{% else %}{{ labels.add }}{% endif %}</h2><p>{{ labels.manual }}</p>{% if saved %}<p role="status">{{ labels.saved }}</p>{% endif %}{% if tool.image %}<img class="tool-admin-image" src="{% url 'tool_admin_image' tool.pk tool.image_serial %}" alt="{{ tool.title_ar }}">{% endif %}<form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button>{{ labels.save }}</button></form></section>{% endblock %}
