name: ANTHEEC foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: antheec_test
          POSTGRES_USER: antheec
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U antheec -d antheec_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: antheec_app.settings.test
      ANTHEEC_DB_ENGINE: postgresql
      PGDATABASE: antheec_test
      PGUSER: antheec
      PGPASSWORD: synthetic-ci-only
      PGHOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime and matching PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Verify PostgreSQL client major
        run: |
          python - <<'PYCLIENT'
          import subprocess
          for tool in ("pg_dump", "pg_restore", "createdb"):
              version = subprocess.check_output([tool, "--version"], text=True).strip()
              print(version)
              assert version.split()[2].split(".")[0] == "16", version
          PYCLIENT
      - run: pip install -r requirements.txt
      - run: python tools/validate_baseline.py
      - run: python -m unittest discover -s tests -v
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python deploy/predeploy.py
      - run: python manage.py seed_demo
      - run: python manage.py seed_policy_prices
      - run: pip check
      - run: python manage.py test content governance --verbosity=2
      - run: python tools/validate_recovery.py
        env:
          CI: 'true'
          # Public synthetic fixture from settings.test; never a deployed key.
          ANTHEEC_DATA_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file deploy/Dockerfile --tag anthec-owner-test:ci .
      - run: docker run --rm --network none anthec-owner-test:ci python tools/validate_container_runtime.py
